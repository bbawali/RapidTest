<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Examination Portal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{
  --bg:#0B1020; --side:#111827; --card:#1B2538; --card2:#223049; --line:#2C3B57;
  --primary:#6366F1; --primary-h:#7679F5; --secondary:#06B6D4; --ok:#10B981; --warn:#F59E0B; --err:#EF4444;
  --text:#F8FAFC; --muted:#94A3B8; --purple:#8B5CF6; --radius:14px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 600px at 80% -10%,rgba(99,102,241,.14),transparent),radial-gradient(900px 500px at -10% 110%,rgba(6,182,212,.10),transparent);background-attachment:fixed;color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;overflow-wrap:break-word}
h1,h2,h3{line-height:1.25;margin:0 0 .6rem}
h1{font-size:1.7rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:.4rem 0}
.muted{color:var(--muted)} .tiny{font-size:.82rem;color:var(--muted)}
a{color:var(--secondary)}
:focus-visible{outline:3px solid var(--secondary);outline-offset:2px;border-radius:6px}

/* buttons */
.btn{appearance:none;border:1px solid transparent;border-radius:10px;padding:.62rem 1.1rem;font:inherit;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s,opacity .15s;color:var(--text);background:var(--card2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary)} .btn-primary:hover:not(:disabled){background:var(--primary-h)}
.btn-secondary{background:transparent;border-color:var(--line)} .btn-secondary:hover:not(:disabled){border-color:var(--secondary);color:var(--secondary)}
.btn-danger{background:var(--err)} .btn-danger:hover:not(:disabled){background:#F25C5C}
.btn-success{background:var(--ok);color:#04251A} .btn-success:hover:not(:disabled){background:#22C493}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--line)} .btn-ghost:hover:not(:disabled){color:var(--text);border-color:var(--muted)}
.btn-sm{padding:.38rem .75rem;font-size:.88rem}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.9rem}

/* forms */
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem}
.field label,.lbl{font-weight:600;font-size:.92rem}
input[type=text],input[type=password],input[type=tel],input[type=number],select,textarea{width:100%;background:#0F1729;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.62rem .8rem;font:inherit}
input::placeholder,textarea::placeholder{color:#64748B}
textarea{resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88rem;line-height:1.45}
select{appearance:auto}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 1rem}
.err{color:#FCA5A5;font-size:.87rem}
.hint{color:var(--muted);font-size:.88rem}
input[aria-invalid=true],select[aria-invalid=true]{border-color:var(--err)}

/* cards & layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem 1.3rem;margin-bottom:1.1rem}
.card.flat{background:#17213A}
.center-wrap{max-width:860px;margin:0 auto;padding:2.2rem 1rem 2rem}
.narrow{max-width:460px}
.hero{text-align:center;margin-bottom:1.6rem}
.hero .logo{width:62px;height:62px;margin:0 auto .8rem;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center}
.sub{color:var(--muted);max-width:560px;margin:.3rem auto}
.role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1.4rem 0}
.role-card{appearance:none;text-align:left;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.6rem;cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s}
.role-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.role-card h2{margin:.7rem 0 .3rem;font-size:1.3rem}
.role-card p{color:var(--muted);margin:0}
.role-ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:rgba(99,102,241,.18);color:#A5B4FC}
.role-card.stu .role-ico{background:rgba(6,182,212,.16);color:#67E8F9}
.notice{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:#FCD34D;border-radius:12px;padding:.8rem 1rem;font-size:.9rem}
.notice.info{background:rgba(6,182,212,.08);border-color:rgba(6,182,212,.3);color:#A5F3FC}
.flash{border-radius:12px;padding:.75rem 1rem;margin-bottom:1rem;border:1px solid;font-weight:500}
.flash.success{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.5);color:#6EE7B7}
.flash.error{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.5);color:#FCA5A5}
.flash.warning{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.5);color:#FCD34D}
.flash.info{background:rgba(6,182,212,.1);border-color:rgba(6,182,212,.4);color:#A5F3FC}

/* admin shell */
.admin{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--side);border-right:1px solid var(--line);padding:1.2rem 1rem;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:1rem}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:700}
.brand .logo-sm{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;flex:none}
.sidebar nav{display:flex;flex-direction:column;gap:.25rem}
.nav-btn{appearance:none;text-align:left;font:inherit;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:10px;padding:.6rem .8rem;cursor:pointer}
.nav-btn:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav-btn.active{background:rgba(99,102,241,.2);color:#fff;border-color:rgba(99,102,241,.5)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:.6rem}
.content{padding:1.6rem clamp(1rem,3vw,2.4rem) 3rem;min-width:0;max-width:1200px;width:100%}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:1.1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem}
.stat .n{font-size:2rem;font-weight:800;line-height:1.1}
.stat .l{color:var(--muted);font-size:.9rem}
.stat.a1{border-top:3px solid var(--primary)} .stat.a2{border-top:3px solid var(--secondary)} .stat.a3{border-top:3px solid var(--warn)} .stat.a4{border-top:3px solid var(--ok)}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:.6rem .75rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:160px}
th{background:#17213A;color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:.12rem .6rem;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid}
.badge.pass,.badge.done{background:rgba(16,185,129,.15);color:#6EE7B7;border-color:rgba(16,185,129,.5)}
.badge.fail{background:rgba(239,68,68,.15);color:#FCA5A5;border-color:rgba(239,68,68,.5)}
.badge.prog{background:rgba(245,158,11,.15);color:#FCD34D;border-color:rgba(245,158,11,.5)}
.badge.new{background:rgba(148,163,184,.12);color:#CBD5E1;border-color:rgba(148,163,184,.4)}
.empty{text-align:center;padding:1.6rem 1rem;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* question rendering */
.rt{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.rt .katex-display,.q-stem .katex-display{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:.15em 0;margin:.6em 0}
.qcard{border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin-bottom:.9rem;background:#17213A}
.qcard .qhead{display:flex;justify-content:space-between;gap:.6rem;align-items:center;margin-bottom:.5rem;flex-wrap:wrap}
.chip{display:inline-block;padding:.12rem .65rem;border-radius:999px;font-size:.78rem;font-weight:700;background:rgba(99,102,241,.2);color:#C7D2FE;border:1px solid rgba(99,102,241,.45)}
.chip-review{background:rgba(139,92,246,.2);color:#DDD6FE;border-color:rgba(139,92,246,.5)}
.opts{display:grid;gap:.45rem;margin:.7rem 0}
.o{display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem;background:#0F1729}
.o .ltr{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;background:var(--card2)}
.o.correct{border-color:var(--ok);background:rgba(16,185,129,.10)} .o.correct .ltr{background:var(--ok);color:#04251A}
.o.wrong{border-color:var(--err);background:rgba(239,68,68,.10)} .o.wrong .ltr{background:var(--err)}
.o .tag{margin-left:auto;flex:none;font-size:.74rem;font-weight:700;padding:.05rem .5rem;border-radius:999px;border:1px solid;white-space:nowrap}
.o .tag.t-ok{color:#6EE7B7;border-color:rgba(16,185,129,.6)} .o .tag.t-bad{color:#FCA5A5;border-color:rgba(239,68,68,.6)} .o .tag.t-you{color:#C7D2FE;border-color:rgba(99,102,241,.6)}
.solution{margin-top:.6rem;padding:.75rem .9rem;border-left:3px solid var(--secondary);background:rgba(6,182,212,.07);border-radius:0 10px 10px 0}
.solution .lbl{color:#67E8F9;display:block;margin-bottom:.2rem}
.marks{font-weight:700}
.marks.pos{color:#6EE7B7} .marks.neg{color:#FCA5A5} .marks.zero{color:var(--muted)}
pre.errs,ul.errs{margin:.4rem 0 0;padding-left:1.2rem}
ul.errs li{margin:.2rem 0;color:#FCA5A5}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:.4rem 0 0}
.kv>div{background:#17213A;border:1px solid var(--line);border-radius:10px;padding:.55rem .8rem}
.kv dt{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kv dd{margin:.1rem 0 0;font-weight:700;font-size:1.05rem}
.big-score{font-size:2.4rem;font-weight:800;line-height:1}
.q-pick{display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;margin-bottom:.6rem;background:#17213A;cursor:pointer}
.q-pick:hover{border-color:var(--primary)}
.q-pick input{margin-top:.35rem;width:1.1rem;height:1.1rem;flex:none}
.q-pick .rt{flex:1}

/* tests list (student) */
.test-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.test-card{margin:0;display:flex;flex-direction:column;gap:.5rem}
.test-card .btn-row{margin-top:auto;padding-top:.5rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.9rem clamp(1rem,3vw,2.4rem);border-bottom:1px solid var(--line);background:var(--side)}
.page{max-width:1100px;margin:0 auto;padding:1.4rem clamp(1rem,3vw,2rem) 3rem}

/* exam */
.exam-head{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;padding:.7rem clamp(.8rem,3vw,2rem);background:rgba(17,24,39,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.eh-left{display:flex;flex-direction:column;min-width:0}
.eh-right{display:flex;gap:.5rem;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.45rem;padding:.2rem .9rem;border-radius:10px;background:#0F1729;border:1px solid var(--line);letter-spacing:.04em}
.timer.low{color:var(--warn);border-color:var(--warn)} .timer.crit{color:#FCA5A5;border-color:var(--err)}
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:1.1rem;max-width:1200px;margin:0 auto;padding:1.1rem clamp(.8rem,3vw,2rem) 3rem;align-items:start}
.q-stem{font-size:1.1rem;margin:.6rem 0 1rem}
.options{display:grid;gap:.6rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:.8rem .95rem;background:#0F1729;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--primary)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .opt-letter{flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.opt.sel{border-color:var(--primary);background:rgba(99,102,241,.16)} .opt.sel .opt-letter{background:var(--primary);border-color:var(--primary)}
.opt:has(input:focus-visible){outline:3px solid var(--secondary);outline-offset:2px}
.q-actions,.q-nav{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.q-nav{justify-content:space-between;border-top:1px solid var(--line);padding-top:1rem}
.palette{position:sticky;top:76px}
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:.45rem;margin:.6rem 0 .9rem}
.pal{appearance:none;font:inherit;font-weight:700;height:44px;border-radius:10px;cursor:pointer;color:var(--text);position:relative;border:2px solid var(--line);background:#0F1729}
.pal.s-notvisited{color:var(--muted);border-style:dashed}
.pal.s-unanswered{border-color:var(--err);background:rgba(239,68,68,.16)}
.pal.s-answered{background:var(--ok);border-color:var(--ok);color:#04251A}
.pal.s-review{background:var(--purple);border-color:var(--purple);border-radius:50%}
.pal.s-answered-review{background:var(--ok);border-color:var(--purple);color:#04251A;box-shadow:inset 0 0 0 2px var(--purple)}
.pal.s-answered-review::after{content:"";position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;background:var(--purple);border:2px solid var(--card)}
.pal.current{outline:3px solid #fff;outline-offset:2px}
.legend{display:grid;gap:.35rem;font-size:.82rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:.5rem}
.sw{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none;display:inline-block}
.sw.s-notvisited{border-style:dashed} .sw.s-unanswered{border-color:var(--err);background:rgba(239,68,68,.25)} .sw.s-answered{background:var(--ok);border-color:var(--ok)}
.sw.s-review{background:var(--purple);border-color:var(--purple);border-radius:50%} .sw.s-answered-review{background:var(--ok);border-color:var(--purple)}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(2,6,23,.78);display:grid;place-items:center;z-index:100;padding:16px;overflow:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:480px;width:100%;padding:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{margin-bottom:.8rem}

@media (max-width:900px){
  .admin{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:column;border-right:none;border-bottom:1px solid var(--line)}
  .sidebar nav{flex-direction:row;overflow-x:auto;padding-bottom:.3rem}
  .nav-btn{white-space:nowrap}
  .side-foot{flex-direction:row;align-items:center;justify-content:space-between;margin-top:0}
  .side-foot .tiny{display:none}
  .exam-grid{grid-template-columns:1fr}
  .palette{position:static}
}
@media (max-width:520px){
  h1{font-size:1.4rem}
  .timer{font-size:1.15rem}
  .btn{padding:.6rem .9rem}
  .q-nav .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
input[type=email]{width:100%;background:#0F1729;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.62rem .8rem;font:inherit}
input[type=email][aria-invalid=true]{border-color:var(--err)}
.spinner{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--secondary);border-radius:50%;margin:0 auto 1rem;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.savestate{font-size:.8rem;color:var(--muted)} .savestate.off{color:#FCD34D}
code{background:#0F1729;border:1px solid var(--line);border-radius:6px;padding:.05rem .4rem;font-size:.88em}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:4s}}
</style>

<!-- The AI extraction prompt (kept verbatim; read into a JavaScript string constant below). -->
<script type="text/plain" id="ai-prompt-source">
You are an expert {{SUBJECT}} Question Paper Analyst, {{SUBJECT}} Problem Solver, Formatting Specialist, and JSON Validation Expert.

I will provide a {{SUBJECT}} question paper in the form of a PDF, scanned page, image, screenshot, or pasted text.

Your job is to extract all eligible single-correct-answer multiple-choice questions from the provided source and produce a verified, strictly valid JSON array for import into an online examination portal.

Follow every instruction precisely.

### A. QUESTION EXTRACTION

1. Carefully inspect the source.
2. Identify every question that has exactly four answer options.
3. Preserve the meaning, terminology, notation, numerical values, and original option order.
4. Extract only questions that have exactly one objectively correct answer.
5. Exclude descriptive, essay-type, numerical-entry, multi-correct, opinion-based, and incomplete questions.
6. Do not fabricate missing text, passages, diagrams, answer choices, or data.
7. If part of a question is unreadable or ambiguous, exclude it rather than guessing.
8. Maintain the original order of all extracted eligible questions.
9. If a diagram, figure, map, graph, or image is essential but cannot be faithfully represented as text or LaTeX, exclude that question.
10. If several questions share a passage, table, or data set, copy the full shared text into the `stem` of every question that depends on it, so that each question stands alone.
11. Keep the original language and script of the source (for example English, Hindi, or Bengali). Do not translate anything.

### B. EXACT JSON SCHEMA

Return a JSON array.

Each element must be an object containing exactly five properties:

- `id`: string.
- `stem`: string.
- `options`: array of exactly four strings.
- `correctOption`: integer.
- `solution`: string.

Do not include additional keys.

Do not wrap the array inside another object.

### C. UNIQUE QUESTION IDS

Generate an ID for each extracted question.

Format:

`q_<topic>_<randomAlphanumericSuffix>`

Example:

`q_astro_k8mQ4sL2`

Rules:

1. Prefix every ID with `q_`.
2. Include a brief topic or chapter identifier relevant to {{SUBJECT}}, in lowercase English letters.
3. Use an alphanumeric suffix containing at least eight reasonably random characters.
4. Use only letters, digits, underscores, and hyphens. No spaces or other symbols.
5. Ensure IDs are unique throughout the output.
6. Do not use sequential IDs such as `q1`, `q2`, or `q3`.

### D. QUESTION STATEMENTS

The `stem` field must contain the complete question statement.

Preserve all conditions, data, values, units, names, dates, quotations, and any passage the question depends on.

Do not combine the four answer options into the question statement.

### E. ANSWER OPTIONS

The `options` field must contain exactly four nonempty strings.

Rules:

1. Maintain original option order.
2. Remove labels such as (a), (b), (c), (d), A., B., 1., and 2.
3. Do not insert answer letters inside option strings.
4. Preserve the content of each option accurately.
5. Do not invent substitute choices.

### F. CORRECT ANSWER IDENTIFICATION

Use the field `correctOption`.

It must contain a zero-based integer:

- `0` = Option A.
- `1` = Option B.
- `2` = Option C.
- `3` = Option D.

Do not use strings such as `"A"` or `"Option B"`.

Independently solve or reason through every question before selecting the correct answer.

Do not blindly rely on a printed answer key.

If the question has no correct option or more than one correct option, or if the correct answer depends on facts you cannot verify with confidence, exclude it.

### G. SOLUTIONS AND EXPLANATIONS

Every question must contain a correct, self-contained explanation in the `solution` field.

The solution must:

1. State the relevant principle, formula, rule, fact, or concept from {{SUBJECT}}.
2. Show the essential reasoning or calculation steps.
3. Explain important transformations, inferences, or logical steps.
4. Reach the correct conclusion.
5. Make clear why the selected option is correct and, where helpful, briefly why the main alternatives are wrong.

For conceptual, factual, or language questions, give clear reasoning rather than artificial calculations.

Verify facts, names, dates, signs, units, arithmetic, formulas, and final answers.

Do not return merely "Option A is correct" without justification.

### H. FORMATTING OF FORMULAS, SYMBOLS, AND SPECIAL TEXT

The portal renders formulas with KaTeX.

Use KaTeX-compatible LaTeX wherever the text contains a mathematical expression, formula, equation, symbol, chemical formula or equation, unit with exponents, or scientific notation:

- Inline: `\( ... \)`
- Display: `\[ ... \]`

Subject guidance:

- Mathematics, Physics, Statistics, Engineering: put every expression, variable, and equation in LaTeX. Write units upright, for example `\\(9.8\\,\\mathrm{m\\,s^{-2}}\\)`.
- Chemistry: write chemical formulas and reactions in LaTeX using `\\mathrm`, for example `\\(\\mathrm{H_2SO_4}\\)` and `\\(\\mathrm{2H_2 + O_2 \\rightarrow 2H_2O}\\)`. Do not use `\ce`.
- Biology, Computer Science, Economics, Accountancy, Reasoning: use LaTeX only for genuine formulas, numbers with exponents, or symbols; everything else is plain text.
- Languages, History, Geography, Political Science, General Knowledge, and other verbal subjects: use plain text. Do not use LaTeX unless the text really contains a formula.
- Never use unsupported KaTeX commands, and never use HTML or Markdown formatting.

Plain text may contain line breaks written as `\n` (for example in a poem, a passage, or a code snippet).

Since the result must be valid JSON, escape every LaTeX backslash correctly.

Examples of the actual JSON output:

Inline equation:

`"\\(x^2-4x+3=0\\)"`

Fraction:

`"\\(\\frac{x+1}{x-1}\\)"`

   6. EXAMINATION ATTEMPTS, TIMER AND FINALISATION
   ===================================================================== */
const finalizing = new Set();
const failBackoff = new Map();
function findSubmission(testId, studentId) { return state.submissions.find(s => s.testId === testId && s.studentId === studentId) || null; }

/* Creates the final submission. The local copy is added immediately (the SDK applies writes
   locally first) and replaced by the server copy when the snapshot arrives. */
function finalizeAttempt(attemptId, reason) {
  if (finalizing.has(attemptId)) return null;
  const att = state.attempts.find(a => a.id === attemptId);
  if (!att) return null;
  const existing = findSubmission(att.testId, att.studentId);
  if (existing) return existing;
  const test = state.tests.find(t => t.id === att.testId);
  if (!test) return null;
  const back = failBackoff.get(attemptId);
  if (back && Date.now() < back) return null;
  const dl = deadlineMs(att, test);
  const finalReason = (reason === 'timeout' || serverNow() >= dl) ? 'timeout' : 'manual';
  const answers = {};
  test.questionSnapshots.forEach(q => { answers[q.id] = Number.isInteger(att.answers[q.id]) ? att.answers[q.id] : null; });
  const g = gradeAnswers(test, answers);
  const startedMs = Date.parse(att.startedAt);
  const local = Object.assign({
    id: attemptId, testId: att.testId, studentId: att.studentId, startedAt: att.startedAt,
    submittedAt: new Date(finalReason === 'timeout' ? dl : serverNow()).toISOString(), answers: answers
  }, g, { submissionReason: finalReason });
  state.submissions.push(local);
  finalizing.add(attemptId);
  const payload = Object.assign({
    testId: att.testId, studentId: att.studentId, startedAt: Timestamp.fromMillis(startedMs),
    submittedAt: finalReason === 'timeout' ? Timestamp.fromMillis(dl) : serverTimestamp(), answers: answers
  }, g, { submissionReason: finalReason });
  setDoc(doc(db, 'submissions', attemptId), payload).catch(e => {
    console.error('Submission failed', e);
    state.submissions = state.submissions.filter(s => s !== local);
    failBackoff.set(attemptId, Date.now() + 30000);
    if (session.role === 'student') notify('error', 'Your submission could not be saved: ' + authErrMsg(e));
    else renderSoon();
  }).finally(() => { finalizing.delete(attemptId); });
  return local;
}

  state.attempts.slice().forEach(a => {
    if (findSubmission(a.testId, a.studentId)) return;
    const t = state.tests.find(x => x.id === a.testId);

}

  const batches = uniqueBatches();
  if (!batches.length) errs.batch = 'Register at least one student before creating a test.';
  else if (!batch) errs.batch = 'Select a target batch.';
  else if (!batches.some(b => batchKey(b) === batchKey(batch))) errs.batch = 'The selected batch has no registered students.';
  let dur = NaN;
  if (!/^\d+$/.test(durStr)) errs.duration = 'Duration must be a whole number of minutes.';
  else { dur = parseInt(durStr, 10); if (dur < 1 || dur > 180) errs.duration = 'Duration must be between 1 and 180 minutes.'; }
  let pass = NaN;
  if (passStr === '' || !isFinite(Number(passStr))) errs.pass = 'Enter a pass mark between 0 and 100.';
  else { pass = Number(passStr); if (pass < 0 || pass > 100) errs.pass = 'Pass mark must be between 0 and 100.'; }
  const ids = Array.from(ui.selected);
  if (ids.length === 0) errs.questions = 'Select at least one question.';
  else if (ids.some(id => !state.questions.some(q => q.id === id))) errs.questions = 'One or more selected questions no longer exist.';
  if (Object.keys(errs).length) { ui.formErrors = { test: errs }; ui.flash = null; render(); return; }
  const batchLabel = batches.find(b => batchKey(b) === batchKey(batch));
  const test = {
    title: title, batch: batchLabel, batchKey: batchKey(batchLabel), durationMinutes: dur, passMarkPercent: pass,
    questionSnapshots: state.questions.filter(q => ui.selected.has(q.id)).map(q => ({ id: q.id, stem: q.stem, options: q.options.slice(), correctOption: q.correctOption, solution: q.solution })),
    status: 'deployed', createdAt: serverTimestamp(), deployedAt: serverTimestamp()
  };
  const size = new TextEncoder().encode(JSON.stringify(test.questionSnapshots)).length;
  if (size > 800000) { ui.formErrors = { test: { questions: 'The selected questions are too large for one test (limit about 800 KB). Select fewer questions.' } }; ui.flash = null; render(); return; }
  ui.busy = true;
  try {
    await setDoc(doc(collection(db, 'tests')), test);
    ui.drafts.testTitle = ''; ui.drafts.testBatch = ''; ui.drafts.testDuration = '30'; ui.drafts.testPass = '40'; ui.selected = new Set(); ui.formErrors = {};
    notify('success', 'Test deployed successfully for batch ' + batchLabel + '.');
  } catch (e) {
    console.error(e); ui.formErrors = {}; notify('error', authErrMsg(e));
  } finally { ui.busy = false; }
}
function updateTestSummary() {
  const box = $('#testSummary'); if (box) box.innerHTML = testSummaryHtml();
  const cnt = $('#selCount'); if (cnt) cnt.textContent = selectedQuestionIds().length + ' selected';

function exportBackup() {
  if (session.role !== 'admin') return;
  try {
    const strip = o => { const c = {}; Object.keys(o).forEach(k => { if (k.charAt(0) !== '_') c[k] = o[k]; }); return c; };
    const out = { exportedAt: nowIso(), source: 'firestore', questions: state.questions.map(strip), students: state.students.map(strip), tests: state.tests.map(strip), attempts: state.attempts.map(strip), submissions: state.submissions.map(strip) };
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'classroom-exam-backup-' + localDateStamp() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    notify('success', 'Backup file generated. Check your browser’s downloads for classroom-exam-backup-' + localDateStamp() + '.json.');
  } catch (e) { notify('error', 'Could not create the backup file: ' + e.message); }
}

function optionsHtml(q, selected, mode) {
  return '<div class="opts">' + q.options.map((o, i) => {

    let cls = 'o', tags = '';

    else {

    state.tests.map(t => '<tr><td class="wrap">' + esc(t.title) + '</td><td>' + esc(t.batch) + '</td><td>' + t.questionSnapshots.length + '</td><td>' + t.durationMinutes + ' min</td><td>' + (4 * t.questionSnapshots.length) + '</td><td>' + esc(t.passMarkPercent) + '%</td><td>' + esc(fmtDate(t.deployedAt)) + '</td><td>' + state.submissions.filter(s => s.testId === t.id).length + '</td><td><button class="btn btn-secondary btn-sm" data-action="view-results" data-id="' + esc(t.id) + '">View Results</button></td></tr>').join('') + '</tbody></table></div>';
}
function secResults() {
  if (ui.detailSubId) {
    const sub = state.submissions.find(s => s.id === ui.detailSubId);
    const test = sub && state.tests.find(t => t.id === sub.testId), st = sub && state.students.find(s => s.id === sub.studentId);
    if (sub && test && st) return '<div class="btn-row" style="margin:0 0 1rem"><button class="btn btn-secondary" data-action="close-detail">Back to Results</button></div><h1>Result details</h1>' + resultBody(sub, test, st);
    ui.detailSubId = null;
  }
  const f = ui.resultsFilter;
  const subs = state.submissions.filter(s => f === 'all' || s.testId === f).slice().sort((a, b) => Date.parse(b.submittedAt) - Date.parse(a.submittedAt));
  const sel = '<div class="field" style="max-width:420px"><label for="resFilter">Show results for</label><select id="resFilter" data-change="results-filter"><option value="all">All tests</option>' +
    state.tests.map(t => '<option value="' + esc(t.id) + '"' + (f === t.id ? ' selected' : '') + '>' + esc(t.title) + ' (' + esc(t.batch) + ')</option>').join('') + '</select></div>';
  let table;
  if (!subs.length) table = '<div class="empty">No completed submissions' + (f === 'all' ? ' yet' : ' for this test yet') + '.</div>';
  else table = '<div class="table-wrap"><table><thead><tr><th>Test Title</th><th>Student Name</th><th>WhatsApp Number</th><th>Batch</th><th>Correct</th><th>Incorrect</th><th>Unanswered</th><th>Score</th><th>Max Score</th><th>Percentage</th><th>Result</th><th>Submission Time</th><th>Reason</th><th></th></tr></thead><tbody>' +
    subs.map(s => {
      const t = state.tests.find(x => x.id === s.testId), st = state.students.find(x => x.id === s.studentId);
      return '<tr><td class="wrap">' + esc(t ? t.title : '—') + '</td><td>' + esc(st ? st.name : '—') + '</td><td>' + esc(st ? st.phone : '—') + '</td><td>' + esc(st ? st.batch : '—') + '</td><td>' + s.correctCount + '</td><td>' + s.incorrectCount + '</td><td>' + s.unansweredCount + '</td><td>' + fmtScore(s.score) + '</td><td>' + s.maximumScore + '</td><td>' + fmtPct(s.percentage) + '</td><td><span class="badge ' + (s.passed ? 'pass' : 'fail') + '">' + (s.passed ? 'Pass' : 'Fail') + '</span></td><td>' + esc(fmtDate(s.submittedAt)) + '</td><td>' + esc(s.submissionReason) + '</td><td>' + (t && st ? '<button class="btn btn-secondary btn-sm" data-action="view-detail" data-id="' + esc(s.id) + '">View Details</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  return '<h1>Results</h1>' + sel + table;
}
function secBackup() {
  return '<h1>Backup</h1>' +
    '<section class="card"><h2>Export Backup</h2><p class="muted">Download a complete snapshot (questions, students, tests, attempts and submissions) as a JSON file. Your live data stays in Firebase; this is an extra copy for safekeeping. Exporting does not change any data. Keep the file private: it contains student phone numbers.</p>' +
    '<div class="btn-row"><button class="btn btn-primary" data-action="export-backup">Export Backup</button></div></section>';
}

/* ---------- student ---------- */
function studentTopbar(st) {
  return '<div class="topbar"><div class="brand"><span class="logo-sm">' + LOGO.replace('width="30" height="30"', 'width="20" height="20"') + '</span><span>Classroom Examination Portal</span></div>' +
    '<div style="display:flex;align-items:center;gap:.8rem"><span class="muted">' + esc(st.name) + '</span><button class="btn btn-secondary btn-sm" data-action="logout">Logout</button></div></div>';
}
function viewStudentDashboard() {
  const st = currentStudent();
  const tests = state.tests.filter(t => batchKey(t.batch) === batchKey(st.batch));
  const cards = tests.length ? '<div class="test-grid">' + tests.map(t => {
    const sub = findSubmission(t.id, st.id), att = sub ? null : findAttempt(t.id, st.id);
    const status = sub ? ['done', 'Completed'] : att ? ['prog', 'In Progress'] : ['new', 'Not Started'];
    const btn = sub ? '<button class="btn btn-primary" data-action="view-result" data-id="' + esc(sub.id) + '">View Result</button>'
      : att ? '<button class="btn btn-primary" data-action="resume-test" data-id="' + esc(t.id) + '">Resume Test</button>'
      : '<button class="btn btn-primary" data-action="start-test" data-id="' + esc(t.id) + '">Start Test</button>';
    return '<article class="card test-card"><div style="display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start"><h3 style="margin:0">' + esc(t.title) + '</h3><span class="badge ' + status[0] + '">' + status[1] + '</span></div>' +
      '<div class="kv"><div><dt>Questions</dt><dd>' + t.questionSnapshots.length + '</dd></div><div><dt>Duration</dt><dd>' + t.durationMinutes + ' min</dd></div><div><dt>Max marks</dt><dd>' + (4 * t.questionSnapshots.length) + '</dd></div><div><dt>Pass</dt><dd>' + esc(t.passMarkPercent) + '%</dd></div></div>' +
      '<div class="btn-row">' + btn + '</div></article>';
  }).join('') + '</div>' : '<div class="empty">No tests have been assigned to your batch yet.</div>';
  return studentTopbar(st) + '<main class="page">' + flashHtml() + '<h1>Welcome, ' + esc(st.name) + '</h1><p class="muted">Batch: <strong>' + esc(st.batch) + '</strong></p><h2 style="margin-top:1.4rem">Your tests</h2>' + cards + '</main>';
}
function viewInstructions() {
  const st = currentStudent();
  const t = state.tests.find(x => x.id === ui.instrTestId);
  if (!t || batchKey(t.batch) !== batchKey(st.batch)) { ui.screen = 'student'; return viewStudentDashboard(); }
  const N = t.questionSnapshots.length;
  return studentTopbar(st) + '<main class="page">' + flashHtml() + '<div class="card"><h1>' + esc(t.title) + '</h1><p class="muted">Batch ' + esc(t.batch) + '</p>' +
    '<div class="kv"><div><dt>Total questions</dt><dd>' + N + '</dd></div><div><dt>Time limit</dt><dd>' + t.durationMinutes + ' min</dd></div><div><dt>Positive marking</dt><dd>+4 per correct</dd></div><div><dt>Negative marking</dt><dd>−1 per incorrect</dd></div><div><dt>Maximum marks</dt><dd>' + (4 * N) + '</dd></div><div><dt>Pass percentage</dt><dd>' + esc(t.passMarkPercent) + '%</dd></div></div>' +
    '<h2 style="margin-top:1.3rem">Instructions</h2><ul>' +
    '<li>You can move between questions freely and change your answers before submitting.</li>' +
    '<li>You can mark questions for review; marked questions are still graded normally.</li>' +
    '<li>Unanswered questions receive zero marks.</li>' +
    '<li>The examination is submitted automatically when the time expires.</li>' +
    '<li>Submission is final &mdash; each test can be attempted only once.</li>' +
    '<li>Your results and worked solutions are shown after submission.</li></ul>' +
    '<p class="notice">The timer starts when you press <strong>Begin Examination</strong>. It keeps running even if you refresh, log out, switch device or close the browser.</p>' +
    '<div class="btn-row"><button class="btn btn-primary" data-action="begin-exam">Begin Examination</button><button class="btn btn-secondary" data-action="back-dashboard">Back</button></div></div></main>';
}
function qState(att, q) {
  const answered = att.answers[q.id] !== null && att.answers[q.id] !== undefined, marked = att.reviewFlags.indexOf(q.id) >= 0, visited = att.visited.indexOf(q.id) >= 0;
  if (answered && marked) return 'answered-review';
  if (marked) return 'review';
  if (answered) return 'answered';
  if (visited) return 'unanswered';
  return 'notvisited';
}
const STATE_LABEL = { 'notvisited': 'Not visited', 'unanswered': 'Visited, unanswered', 'answered': 'Answered', 'review': 'Marked for review', 'answered-review': 'Answered and marked for review' };
function viewExam() {
  const st = currentStudent();
  const test = state.tests.find(t => t.id === ui.exam.testId);
  const att = findAttempt(ui.exam.testId, st.id);
  const N = test.questionSnapshots.length;
  const idx = Math.max(0, Math.min(N - 1, ui.exam.index));
  const q = test.questionSnapshots[idx];
  const sel = att.answers[q.id], marked = att.reviewFlags.indexOf(q.id) >= 0;
  const rem = Math.max(0, deadlineMs(att, test) - serverNow());
  const timerCls = rem <= 60000 ? ' crit' : rem <= 300000 ? ' low' : '';
  const answered = test.questionSnapshots.filter(x => att.answers[x.id] !== null && att.answers[x.id] !== undefined).length;
  const reviewCount = test.questionSnapshots.filter(x => att.reviewFlags.indexOf(x.id) >= 0).length;
  const online = navigator.onLine !== false;
  const saveTxt = !online ? 'Offline — answers will sync when reconnected' : (att._pending ? 'Saving…' : 'All changes saved');
  const pal = test.questionSnapshots.map((x, i) => { const s = qState(att, x); return '<button class="pal s-' + s + (i === idx ? ' current' : '') + '" data-action="jump" data-index="' + i + '" aria-label="Question ' + (i + 1) + ': ' + STATE_LABEL[s] + '"' + (i === idx ? ' aria-current="true"' : '') + '>' + (i + 1) + '</button>'; }).join('');
  const modal = ui.exam.confirmOpen
    ? '<div class="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle">Submit your examination?</h2>' +
      '<div class="kv"><div><dt>Total questions</dt><dd>' + N + '</dd></div><div><dt>Answered</dt><dd>' + answered + '</dd></div><div><dt>Unanswered</dt><dd>' + (N - answered) + '</dd></div><div><dt>Marked for review</dt><dd>' + reviewCount + '</dd></div></div>' +
      '<p class="muted" style="margin-top:1rem">Submission is final. You cannot change your answers afterwards.</p>' +
      '<div class="btn-row"><button class="btn btn-primary" data-action="confirm-submit">Confirm Submission</button><button class="btn btn-secondary" data-action="close-submit">Continue Examination</button></div></div></div>' : '';
  return '<header class="exam-head"><div class="eh-left"><strong>' + esc(test.title) + '</strong><span class="tiny">' + esc(st.name) + '</span></div>' +
    '<div class="timer' + timerCls + '" id="timer" role="timer" aria-label="Time remaining">' + fmtDuration(rem) + '</div>' +
    '<div class="eh-right"><span class="savestate' + (online ? '' : ' off') + '" role="status">' + esc(saveTxt) + '</span><button class="btn btn-ghost btn-sm" data-action="logout" title="Log out. Your timer keeps running.">Logout</button><button class="btn btn-primary" data-action="open-submit">Submit Test</button></div></header>' +
    (ui.flash ? '<div style="max-width:1200px;margin:.8rem auto 0;padding:0 clamp(.8rem,3vw,2rem)">' + flashHtml() + '</div>' : '') +
    '<div class="exam-grid"><section class="card" aria-label="Question ' + (idx + 1) + ' of ' + N + '">' +
    '<div style="display:flex;gap:.5rem;flex-wrap:wrap"><span class="chip">Question ' + (idx + 1) + ' of ' + N + '</span>' + (marked ? '<span class="chip chip-review">Marked for review</span>' : '') + '</div>' +
    '<div class="rt q-stem">' + esc(q.stem) + '</div>' +
    '<div class="options" role="radiogroup" aria-label="Answer options">' + q.options.map((o, i) => '<label class="opt' + (sel === i ? ' sel' : '') + '"><input type="radio" name="opt" value="' + i + '" data-change="select-option"' + (sel === i ? ' checked' : '') + '><span class="opt-letter">' + 'ABCD'[i] + '</span><span class="rt">' + esc(o) + '</span></label>').join('') + '</div>' +
    '<div class="q-actions"><button class="btn btn-secondary" data-action="clear-answer"' + (sel === null || sel === undefined ? ' disabled' : '') + '>Clear Answer</button>' +
    '<button class="btn btn-secondary" data-action="toggle-review" aria-pressed="' + marked + '">' + (marked ? 'Unmark Review' : 'Mark for Review') + '</button></div>' +
    '<div class="q-nav"><button class="btn btn-secondary" data-action="prev-q"' + (idx === 0 ? ' disabled' : '') + '>Previous</button><button class="btn btn-primary" data-action="next-q"' + (idx === N - 1 ? ' disabled' : '') + '>Next</button></div></section>' +
    '<aside class="card palette" aria-label="Question palette"><h3>Question palette</h3><div class="pal-grid">' + pal + '</div>' +
    '<div class="legend"><span><i class="sw s-notvisited"></i>Not Visited</span><span><i class="sw s-unanswered"></i>Visited but Unanswered</span><span><i class="sw s-answered"></i>Answered</span><span><i class="sw s-review"></i>Marked for Review</span><span><i class="sw s-answered-review"></i>Answered and Marked for Review</span></div></aside></div>' + modal;
}
function viewStudentResult() {
  const st = currentStudent();
  const sub = state.submissions.find(s => s.id === ui.resultSubId && s.studentId === st.id);
  const test = sub && state.tests.find(t => t.id === sub.testId);
  if (!sub || !test) { ui.screen = 'student'; return viewStudentDashboard(); }
  return studentTopbar(st) + '<main class="page">' + flashHtml() + '<div class="btn-row" style="margin:0 0 1rem"><button class="btn btn-secondary" data-action="back-dashboard">Back to Dashboard</button></div><h1>Your result</h1>' + resultBody(sub, test, st) +
    '<div class="btn-row"><button class="btn btn-primary" data-action="back-dashboard">Back to Dashboard</button></div></main>';
}

/* =====================================================================
   9. EVENT HANDLING (delegated; no inline handlers)
   ===================================================================== */
function handleAction(action, el) {
  switch (action) {
    case 'choose-admin': go(adminExists ? 'adminLogin' : 'adminSetup'); break;
    case 'choose-student': go('studentLogin'); break;
    case 'back-welcome': go('welcome'); break;
    case 'logout': logout(); break;
    case 'reload': location.reload(); break;
    case 'forgot-password': forgotPassword(); break;
    case 'nav': if (requireAdmin()) navSection(el.dataset.section); break;
    case 'copy-prompt': if (requireAdmin()) copyPrompt(); break;
    case 'validate-q': if (requireAdmin()) validateQuestions(); break;
    case 'save-q': saveQuestions(); break;
    case 'view-results': if (requireAdmin()) { ui.resultsFilter = el.dataset.id; navSection('results'); } break;
    case 'view-detail': if (requireAdmin()) { ui.detailSubId = el.dataset.id; ui.scrollTop = true; render(); } break;
    case 'close-detail': if (requireAdmin()) { ui.detailSubId = null; ui.scrollTop = true; render(); } break;
    case 'export-backup': exportBackup(); break;
    /* student */
    case 'back-dashboard': if (requireStudent()) { ui.exam = null; go('student'); } break;
    case 'start-test': {
      if (!requireStudent()) break;
      const st = currentStudent(), t = state.tests.find(x => x.id === el.dataset.id);
      if (!t || batchKey(t.batch) !== batchKey(st.batch)) { go('student', { type: 'error', text: 'That test is not available to your batch.' }); break; }
      const sub = findSubmission(t.id, st.id);
      if (sub) { ui.resultSubId = sub.id; go('result'); break; }
      if (findAttempt(t.id, st.id)) { resumeExam(t.id); break; }
      ui.instrTestId = t.id; go('instructions'); break;
    }
    case 'resume-test': if (requireStudent()) resumeExam(el.dataset.id); break;
    case 'view-result': {
      if (!requireStudent()) break;
      const sub = state.submissions.find(s => s.id === el.dataset.id && s.studentId === session.studentId);
      if (sub) { ui.resultSubId = sub.id; go('result'); } else go('student');
      break;
    }
    case 'begin-exam': if (requireStudent()) beginExam(); break;
    /* exam */
    case 'jump': if (examContext()) goQuestion(parseInt(el.dataset.index, 10)); break;
    case 'prev-q': if (examContext()) goQuestion(ui.exam.index - 1); break;
    case 'next-q': if (examContext()) goQuestion(ui.exam.index + 1); break;
    case 'clear-answer': clearAnswer(); break;
    case 'toggle-review': toggleReview(); break;
    case 'open-submit': if (examContext()) { ui.exam.confirmOpen = true; render(); } break;
    case 'close-submit': if (ui.exam) { ui.exam.confirmOpen = false; render(); } break;
    case 'confirm-submit': submitExam(); break;
  }
}
function handleForm(name, form) {
  switch (name) {
    case 'admin-setup': doAdminSetup(form); break;
    case 'admin-login': doAdminLogin(form); break;
    case 'student-login': doStudentLogin(form); break;
    case 'add-student': addStudent(); break;
    case 'deploy-test': deployTest(); break;
  }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t || t.disabled) return;
  handleAction(t.dataset.action, t);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  handleForm(f.dataset.form, f);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'jsonText') {
    ui.jsonText = t.value;
    if (ui.qCheck) {
      ui.qCheck = null;
      const r = $('#importResult'); if (r) r.innerHTML = '<p class="hint">The text changed after validation. Press Validate &amp; Preview again before saving.</p>';
      const b = $('#saveQBtn'); if (b) b.disabled = true;
    }
    return;
  }
  if (t.dataset && t.dataset.draft) {
    ui.drafts[t.dataset.draft] = t.value;
    if (ui.screen === 'admin' && ui.section === 'createTest') updateTestSummary();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.draft) {
    ui.drafts[t.dataset.draft] = t.value;
    if (ui.screen === 'admin' && ui.section === 'createTest') updateTestSummary();
  } else if (t.dataset.qsel !== undefined) {
    if (session.role !== 'admin') return;
    if (t.checked) ui.selected.add(t.dataset.qsel); else ui.selected.delete(t.dataset.qsel);
    updateTestSummary();
  } else if (t.dataset.change === 'select-option') {
    setAnswer(parseInt(t.value, 10));
  } else if (t.dataset.change === 'results-filter') {
    if (session.role !== 'admin') return;
    ui.resultsFilter = t.value; render();
  }
});
document.addEventListener('focusout', () => {
  if (!renderPending) return;
  setTimeout(() => { if (renderPending && !isTypingTarget(document.activeElement)) render(); }, 0);
});
document.addEventListener('keydown', e => {
  const modal = $('.modal');
  if (!modal) return;
  if (e.key === 'Escape') {
    if (ui.exam && ui.exam.confirmOpen) { ui.exam.confirmOpen = false; render(); }
  } else if (e.key === 'Tab') {
    const f = Array.from(modal.querySelectorAll('button:not([disabled])'));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!modal.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.screen === 'exam') tick(); });
window.addEventListener('online', () => { if (ui.screen === 'exam') render(); });
window.addEventListener('offline', () => { if (ui.screen === 'exam') render(); });
window.addEventListener('error', ev => { console.error(ev.error || ev.message); });

/* =====================================================================
   10. START-UP
   ===================================================================== */
function init() {
  render();
  syncClock();
  onAuthStateChanged(auth, user => {
    if (ignoreAuth > 0) return;
    handleAuth(user);
  }, err => {
    console.error(err);
    fatal = { title: 'Cannot connect to Firebase', errors: [authErrMsg(err)] };
    render();
  });
  // Expired attempts are finalised even if nobody is looking at them (teacher or student browser).
  setInterval(() => { if (session.role && isReady()) reconcileExpired(); }, 15000);
  if (document.readyState === 'complete') renderMath($('#app'));
  else window.addEventListener('load', () => renderMath($('#app')));
}
init();

</script>
</body>
